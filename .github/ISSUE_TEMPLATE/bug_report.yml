name: Bug report
description: Something in @moticon/react, @moticon/mcp, or the CLI isn't working.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — a minimal
        reproduction is the single most useful thing.

        **Security issue?** Don't file it here. See
        [SECURITY.md](https://github.com/ferhadsultan98/moticon/tree/main/SECURITY.md)
        for how to report privately.
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      options:
        - "@moticon/react"
        - "@moticon/mcp"
        - "moticon (CLI)"
        - "not sure"
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "e.g. @moticon/react 0.1.2"
    validations:
      required: true
  - type: input
    id: icon
    attributes:
      label: Icon name
      description: If the bug is specific to one icon.
      placeholder: "e.g. Bell"
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        Steps to reproduce, or a link to a minimal repo / StackBlitz / CodeSandbox.
      placeholder: |
        1. import { Bell } from "@moticon/react"
        2. render <Bell size={24} />
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Fill in what applies.
      value: |
        - React version:
        - motion version:
        - Framework (Next.js / Vite / CRA / …) and version:
        - Rendering (App Router / Pages Router / SPA / SSR):
        - Browser and OS:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, console errors, anything else.
